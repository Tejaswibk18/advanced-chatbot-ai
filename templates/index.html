<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Information Assistant</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

    <div class="app-container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <h2>
                    AI Assistant
                </h2>

                <button
                    id="new-chat-button"
                    class="new-chat-button"
                >
                    + New Chat
                </button>

            </div>


            <div class="recent-title">

                Recent Chats

            </div>


            <div
                id="recent-chats"
                class="recent-chats"
            >

                <div class="empty-chats">
                    No recent chats
                </div>

            </div>

        </aside>


        <!-- Main chat -->

        <div class="chat-container">

            <!-- Header -->

            <header class="chat-header">

                <div class="header-content">

                    <div class="header-icon">
                        ✨
                    </div>

                    <div>

                        <h1>
                            AI Information Assistant
                        </h1>

                        <p>
                            Ask anything and learn something new.
                        </p>

                    </div>

                </div>

            </header>


            <!-- Messages -->

            <main
                id="chat-messages"
                class="chat-messages"
            >

                <div class="welcome-message">

                    <div class="welcome-icon">
                        ✨
                    </div>

                    <h2>
                        How can I help you?
                    </h2>

                    <p>
                        Ask me about technology,
                        science, programming,
                        history, or anything else.
                    </p>

                </div>

            </main>


            <!-- Error -->

            <div
                id="error-message"
                class="error-message hidden"
            ></div>


            <!-- Input -->

            <!-- Document Information -->

            <div
                id="document-info"
                class="document-info hidden"
            >

                <div class="document-info-content">

                    <span>
                        📄
                    </span>

                    <div>

                        <strong id="document-name">
                            Document
                        </strong>

                        <small>
                            Attached to this chat
                        </small>

                    </div>

                </div>


                <button
                    type="button"
                    id="remove-document"
                    title="Remove document"
                >
                    ×
                </button>

            </div>


            <!-- Chat Input -->

            <form
                id="chat-form"
                class="chat-input-area"
            >

                <!-- Upload -->

                <button
                    type="button"
                    id="upload-document"
                    class="upload-button"
                    title="Upload document"
                >
                    📎
                </button>


                <input
                    type="file"
                    id="document-input"
                    accept=".pdf,.docx,.txt"
                    hidden
                >


                <!-- Message -->

                <input
                    type="text"
                    id="message-input"
                    placeholder="Ask anything..."
                    autocomplete="off"
                >


                <!-- Send -->

                <button
                    type="submit"
                    id="send-button"
                >
                    Send
                </button>

            </form>


            <div class="footer">
                Powered by Gemini
            </div>

        </div>

    </div>


    <!-- Markdown -->

    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    ></script>


    <!-- Sanitizer -->

    <script
        src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"
    ></script>


    <!-- Application -->

    <script
        src="/static/script.js"
    ></script>

</body>

</html>
