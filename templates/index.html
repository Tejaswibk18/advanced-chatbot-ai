<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Information Assistant</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

    <div class="chat-container">

        <!-- Header -->
        <header class="chat-header">

            <div class="header-content">

                <div class="header-icon">
                    ✨
                </div>

                <div>
                    <h1>AI Information Assistant</h1>

                    <p>
                        Ask anything and learn something new.
                    </p>
                </div>

            </div>


            <button
                id="new-chat-button"
                class="new-chat-button"
            >
                + New Chat
            </button>

        </header>


        <!-- Chat messages -->
        <main
            id="chat-messages"
            class="chat-messages"
        >

            <div class="welcome-message">

                <div class="welcome-icon">
                    ✨
                </div>

                <h2>
                    How can I help you?
                </h2>

                <p>
                    Ask me about technology, science,
                    programming, history, or anything else.
                </p>

            </div>

        </main>


        <!-- Error message -->
        <div
            id="error-message"
            class="error-message hidden"
        ></div>


        <!-- Input -->
        <form
            id="chat-form"
            class="chat-input-area"
        >

            <input
                type="text"
                id="message-input"
                placeholder="Ask anything..."
                autocomplete="off"
            >


            <button
                type="submit"
                id="send-button"
            >
                Send
            </button>

        </form>


        <div class="footer">
            Powered by Gemini
        </div>

    </div>


    <!-- Markdown renderer -->
    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    ></script>


    <!-- HTML sanitizer -->
    <script
        src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"
    ></script>


    <!-- Application JavaScript -->
    <script
        src="/static/script.js"
    ></script>

</body>

</html>
